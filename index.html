<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Hanami</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="style.css" />
  <script type="module" defer src="script.m.js"></script>
  <script type="module" defer src="elements.m.js"></script>
  <template for="hanami-hand"> 
    <div class="cards"></div>
    <div class="buttons">
      <ol class="suits">
        <li class="sunum"><button type="button" name="suits">&#x82B1;</button></li>
      </ol>
      <ol class="numbers">
        <li class="sunum"><button type="button" name="numbers">&#x53F7;</button></li>
      </ol>
    </div>
  </template>
  <template for="hanami-card"> 
    <span class="label"></span>
    <div class="pips"></div>
    <button type="button" name="discard">&#x6368;</button>
    <button type="button" name="play">&#x7F6E;</button>
  </template>
  <template for="hanami-game">
    <div class="mat">
      <div class="discard"></div>
      <div class="drawpile"></div>
      <div class="foundation"></div>
      <div class="time"><span></span></div>
      <div class="food"></div>
    </div>
  </template>
  <template for="hanami-hosted-player">
    <output></output>
    <button class="copy" type="button">Copy</button>
    <textarea placeholder="Put your partner's code here"></textarea>
    <button class="connect" type="button">Connect</button>
  </template>
</head>
<body>
<header>
  <h1>Hanami</h1>
</header>
<main>
  <form action="" autocomplete="off">
    <fieldset>
      <legend>Select Game Type</legend>
      <label>
        <input type="radio" name="gametype" value="hotseat" checked/>
        Hotseat
      </label>
      <label>
        <input type="radio" name="gametype" value="host"/>
        Host
      </label>
      <label>
        <input type="radio" name="gametype" value="join"/>
        Join
      </label>
    </fieldset>
    <fieldset>
      <label><input type="text" name="username" /> Display Name</label>
    </fieldset>
    <fieldset id="hotseat" class="gametypeoptions">
      <legend>Hotseat</legend>
    </fieldset>
    <fieldset id="host" class="gametypeoptions" disabled>
      <legend>Host</legend>
      <div id="hostedplayers"></div>
      <button name="add" type="button">Add</button>
      <button name="start" type="button">Start Game</button> 
    </fieldset>
    <fieldset id="join" class="gametypeoptions" disabled>
      <legend>Join</legend>
      <textarea placeholder="Put your partner's code here"></textarea>
      <button name="join" type="button">Join</button>
      <output></output>
      <button name="copy" type="button">Copy</button>
    </fieldset>
  </form>
</main>
<footer>Made by Benjamin Martin</footer>
</body>
</html>
